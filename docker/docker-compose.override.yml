# Local dev override — exposes port 8080 directly on the host
# In production (Avignon), this file is absent so the container
# stays on the `web` network only.
services:
  enpleinproust:
    ports:
      - "8080:80"
    volumes:
      # En dev local, on pointe le CSV dans un dossier temporaire local
      - ./data/inscriptions:/data/inscriptions
