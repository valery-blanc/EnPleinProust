services:
  enpleinproust:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enpleinproust
    restart: unless-stopped
    volumes:
      - ../kirby:/var/www/html
      # Backup CSV hors container — survit à la destruction du container
      - /home/val/data/enpleinproust:/data/inscriptions
    env_file:
      - ../.env
    networks:
      - web

networks:
  web:
    external: true
