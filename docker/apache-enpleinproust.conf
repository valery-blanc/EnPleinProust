<VirtualHost *:80>
    ServerAdmin val@zitoon.com
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Block direct access to Kirby internals
    <DirectoryMatch "^/var/www/html/(kirby|site|content|storage)">
        Require all denied
    </DirectoryMatch>

    # Allow public assets
    <Directory /var/www/html/assets>
        Require all granted
    </Directory>

    <Directory /var/www/html/media>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
