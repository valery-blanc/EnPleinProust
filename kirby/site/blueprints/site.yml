title: En Plein Proust

options:
  changeTitle: false

tabs:
  site:
    label: Pages
    icon: pages
    columns:
      - width: 2/3
        sections:
          pages:
            type: pages
            label: Pages du site
            templates:
              - home
              - fonctionnement
              - editions
              - nathalie
              - inscription
              - inscriptions
              - default

      - width: 1/3
        sections:
          drafts:
            type: pages
            label: Brouillons
            status: draft
            layout: list

  footer:
    label: Pied de page
    icon: text
    sections:
      footerFields:
        type: fields
        fields:
          footerCopyright:
            label: Mention copyright (après © et l'année)
            type: text
            placeholder: En Plein Proust
            help: "Affiché comme « © 2027 [valeur] » en bas du footer."
          footerAdresse:
            label: Description et adresse (col. gauche)
            type: textarea
            size: small
            buttons: false
            help: "Affiché sous « En Plein Proust » dans le footer. Le **gras** et l'*italique* Markdown sont supportés."
          footerEmail:
            label: Email de contact
            type: text
            placeholder: 24hdeproust@gmail.com
          footerPartenaires:
            label: Partenaires (col. droite)
            type: structure
            fields:
              nom:
                label: Nom du partenaire
                type: text
            help: "Affiché dans la colonne « Avec le soutien de »"
          footerTagline:
            label: Accroche bas de page
            type: text
            placeholder: "Performance gratuite · auberge espagnole · espace douillet"

  inscriptions:
    label: Config inscriptions
    icon: email
    sections:
      emailConfig:
        type: fields
        label: Configuration emails
        fields:
          emailDestinataires:
            label: Destinataires de la notification (séparés par des virgules)
            type: text
            placeholder: nathalie@example.com, organisateur@example.com
            help: Ces adresses reçoivent un email à chaque nouvelle inscription.
          emailConfirmationSujet:
            label: Sujet de l'email de confirmation (envoyé à l'inscrit·e)
            type: text
            default: Votre inscription à En Plein Proust est bien reçue
          emailConfirmationCorps:
            label: Corps de l'email de confirmation
            type: textarea
            size: large
            buttons: false
            help: |
              Tags disponibles : #PRENOM, #NOM, #EMAIL, #TELEPHONE, #CRENEAUX, #MESSAGE
            default: |
              Bonjour #PRENOM,

              Merci pour votre inscription à En Plein Proust.

              Vos préférences de créneaux ont été enregistrées :
              #CRENEAUX

              Nathalie reviendra vers vous par email pour vous communiquer votre ordre de passage exact.

              À bientôt aux Ateliers Mommen !

              L'équipe En Plein Proust
